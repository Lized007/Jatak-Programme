<!DOCTYPE html>
<html>
<head>
    <title>Nakhyatra Calculation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, green, yellow);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333333;
        }

        form {
            margin-bottom: 20px;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            display: block;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #4CAF50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button[type="submit"]:hover {
            background-color: #45a049;
        }

        #result {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        #result p {
            margin: 0;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div id="container">
        <h1>PURBA NAKHSTRA MIN</h1>
        <form id="nakhyatraForm">
            <label for="input1">PURBA DINA RA NAKHYATRA (da la bi):</label>
            <input type="text" id="input1" required>
            <label for="input2">JANMA NAKHYATRA (da la bi):</label>
            <input type="text" id="input2" required>
            <label for="input3">SURYA DAYA BADHIDANDA (da la bi):</label>
            <input type="text" id="input3" required>
            <label for="dasabarsa">DASHA BARSA:</label>
            <input type="number" id="dasabarsa" required>
            <button type="submit">Calculate</button>
        </form>
        <div id="result"></div>
    </div>

    <script>
        document.getElementById("nakhyatraForm").addEventListener("submit", function(event) {
            event.preventDefault();
            calculateNakhyatra();
        });

        function parseInput(inputId) {
            let parts = document.getElementById(inputId).value.trim().split(" ").map(Number);
            return { da: parts[0], la: parts[1], bi: parts[2] };
        }

        function calculateNakhyatra() {
            let da1 = 60, la1 = 0, bi1 = 0;

            let { da: da2, la: la2, bi: bi2 } = parseInput("input1");
            let { da: da4, la: la4, bi: bi4 } = parseInput("input2");
            let { da: da6, la: la6, bi: bi6 } = parseInput("input3");
            let dasabarsa = parseInt(document.getElementById("dasabarsa").value);

            let da3, la3, bi3, da5, la5, bi5, da7, la7, bi7, da8, la8, bi8;
            let da10, la10, bi10, da11, la11, bi11;
            let bhagafala, bhagasesa, bhagafala2, bhagasesa2, bhagafala3;
            let bhajaka, bhajya, bhajya2, bhajya3;
            let da5f, la5f, bi5f, da7f, la7f, bi7f;
            let bhajakaf, bhajyaf, bhajya_temp;

            bi3 = bi1 < bi2 ? (bi1 + 60) - bi2 : bi1 - bi2;
            la3 = bi1 < bi2 ? (la1 - 1) + 60 - la2 : la1 >= la2 ? la1 - la2 : (la1 + 60) - la2;
            da3 = la1 < la2 ? (da1 - 1) - da2 : da1 - da2;

            bi5 = (bi3 + bi4) % 60;
            la5 = ((bi3 + bi4) >= 60 ? 1 : 0) + la3 + la4;
            if (la5 >= 60) {
                la5 -= 60;
                da5 = da3 + da4 + 1;
            } else {
                da5 = da3 + da4;
            }

            bi7 = bi6 < bi2 ? (bi6 + 60) - bi2 : bi6 - bi2;
            la7 = bi6 < bi2 ? (la6 - 1) + 60 - la2 : la6 >= la2 ? la6 - la2 : (la6 + 60) - la2;
            da7 = la6 < la2 ? (da6 - 1) - da2 : da6 - da2;

bi8 = bi5 < bi7 ? (bi5 + 60) - bi7 : bi5 - bi7;
la8 = bi5 < bi7
    ? (la5 - 1) < la7
        ? (la5 - 2) + 60 - la7
        : (la5 - 1) - la7
    : la5 < la7
        ? (la5 + 60) - la7
        : la5 - la7;
da8 = bi5 < bi7
    ? (la5 - 1) < la7
        ? (da5 - 1) - da7
        : da5 - da7
    : la5 < la7
        ? (da5 - 1) - da7
        : da5 - da7;


            let result = document.getElementById("result");
            result.innerHTML = "";
            result.innerHTML += `<p>RUKHYA DANTA ${da5}/${la5}/${bi5}</p>`;
            result.innerHTML += `<p>RUKHYA BHUKTI ${da7}/${la7}/${bi7}</p>`;
            result.innerHTML += `<p>SESA DANDA ${da8}/${la8}/${bi8}</p>`;

            da5f = da5;
            la5f = la5;
            bi5f = bi5 > 9 ? bi5 / 100 : bi5 / 10;
            bhajakaf = da5f * 60 + (bi5f + la5f);
            if (bi5f > 49) bhajakaf += 1;
            bhajaka = Math.floor(bhajakaf);

            da7f = da7;
            la7f = la7;
            bi7f = bi7 > 9 ? bi7 / 100 : bi7 / 10;
            bhajyaf = da7f * 60 + (bi7f + la7f);
            if (bi7f > 49) bhajyaf += 1;
            bhajya_temp = Math.floor(bhajyaf);

            bhajya = bhajya_temp * dasabarsa;
            bhagafala = Math.floor(bhajya / bhajaka);
            bhagasesa = bhajya % bhajaka;
            bhajya2 = bhagasesa * 12;
            bhagafala2 = Math.floor(bhajya2 / bhajaka);
            bhagasesa2 = bhajya2 % bhajaka;
            bhajya3 = bhagasesa2 * 30;
            bhagafala3 = Math.floor(bhajya3 / bhajaka);

            result.innerHTML += `<p>${bhagafala} barsa ${bhagafala2} masa ${bhagafala3} dina</p>`;

            da10 = dasabarsa - 1;
            la10 = 11;
            bi10 = 30;
            bi11 = bi10 < bhagafala3 ? (bi10 + 60) - bhagafala3 : bi10 - bhagafala3;
            la11 = bi10 < bhagafala3 ? (la10 - 1) + 60 - bhagafala2 : la10 >= bhagafala2 ? la10 - bhagafala2 : (la10 + 60) - bhagafala2;
            da11 = la10 < bhagafala2 ? (da10 - 1) - bhagafala : da10 - bhagafala;

            result.innerHTML += `<p>The Answer is ${da11}/${la11}/${bi11}</p>`;
        }
    </script>
</body>
</html>
