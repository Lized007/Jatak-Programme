<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suryadaya badhi danda</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #4a148c, #880e4f);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: rgba(255,255,255,0.1);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    input[type="text"] {
      padding: 10px;
      width: 250px;
      font-size: 16px;
      margin: 8px;
      border-radius: 6px;
      border: none;
      outline: none;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-top: 10px;
      background: #007bff;
      border: none;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Suryadaya Badhi Danda</h2>
  <p>Janma Time: &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <input type="text" id="time1" placeholder="Enter Time 1 (hh mm ss)" />
  </p>
  <p>Su.day/ast Time:
    <input type="text" id="time2" placeholder="Enter Time 2 (hh mm ss)" />
  </p>
  <br/>
  <button onclick="calculateAndConvert()">Convert</button>
  <div id="result"></div>
</div>

<script>
function parseTime(timeStr) {
  const [hh, mm, ss] = timeStr.trim().split(" ").map(Number);
  return { hh, mm, ss };
}

function getTimeDifference(t1, t2) {
  let hh = t1.hh - t2.hh;
  let mm = t1.mm - t2.mm;
  let ss = t1.ss - t2.ss;

  if (ss < 0) {
    ss += 60;
    mm -= 1;
  }
  if (mm < 0) {
    mm += 60;
    hh -= 1;
  }

  if (hh < 0) return null;

  return { hh, mm, ss };
}

function convertToSamaya(h, m, s) {
  let da, la, bi, pa, da1, la1, bi1, pa1, da2, la2, bi2, pa2, da3, la3, bi3, pa3, bi4, la4;
  let h1, decipartofh1, m1, decipartofm1, s1, decipartofs1;

  h1 = h * 2.5;
  da = Math.floor(h1);
  decipartofh1 = h1 - da;
  la = decipartofh1 === 0.5 ? 30 : 0;
  bi = 0;
  pa = 0;

  m1 = m * 2.5;
  if (m < 24) {
    la1 = Math.floor(m1);
    decipartofm1 = m1 - la1;
    bi1 = decipartofm1 === 0.5 ? 30 : 0;
    da1 = 0;
  } else if (m > 23 && m < 48) {
    m1 -= 60;
    la1 = Math.floor(m1);
    decipartofm1 = m1 - la1;
    bi1 = decipartofm1 === 0.5 ? 30 : 0;
    da1 = 1;
  } else {
    m1 -= 120;
    la1 = Math.floor(m1);
    decipartofm1 = m1 - la1;
    bi1 = decipartofm1 === 0.5 ? 30 : 0;
    da1 = 2;
  }
  pa1 = 0;

  s1 = s * 2.5;
  if (s < 24) {
    bi2 = Math.floor(s1);
    decipartofs1 = s1 - bi2;
    pa2 = decipartofs1 === 0.5 ? 30 : 0;
    la2 = 0;
  } else if (s > 23 && s < 48) {
    s1 -= 60;
    bi2 = Math.floor(s1);
    decipartofs1 = s1 - bi2;
    pa2 = decipartofs1 === 0.5 ? 30 : 0;
    la2 = 1;
  } else {
    s1 -= 120;
    bi2 = Math.floor(s1);
    decipartofs1 = s1 - bi2;
    pa2 = decipartofs1 === 0.5 ? 30 : 0;
    la2 = 2;
  }
  da2 = 0;

  pa3 = pa + pa1 + pa2;
  bi4 = bi + bi1 + bi2;
  bi3 = bi4 % 60;
  la4 = la + la1 + la2 + Math.floor(bi4 / 60);
  la3 = la4 % 60;
  da3 = da + da1 + da2 + Math.floor(la4 / 60);

  return `ସମୟ ${da3}/${la3}/${bi3}/${pa3}`;
}

function calculateAndConvert() {
  const t1 = parseTime(document.getElementById("time1").value);
  const t2 = parseTime(document.getElementById("time2").value);
  const diff = getTimeDifference(t1, t2);

  if (!diff) {
    document.getElementById("result").innerText = "Time 1 should be greater than Time 2!";
    return;
  }

  const samaya = convertToSamaya(diff.hh, diff.mm, diff.ss);
  document.getElementById("result").innerText = samaya;
}
</script>

</body>
</html>
